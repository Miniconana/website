<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Jared Isidoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="Eye to eye.mp4" type="video/mp4">
    </video>

    <header>
        <nav>
            <div class="logo">Jared Isidoro</div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#schools">Schools</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="news-section">
            <h2>Contact</h2>
            <p class="contact-intro">You liked what you saw? Get in touch!</p>

            <div class="contact-grid">
                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-label">Email</span>
                        <a href="mailto:jaredcarloisidoro@gmail.com">(Jaredcarloisidoro@gmail.com)</a>
                    </div>

                    <div class="contact-item">
                        <span class="contact-label">Phone</span>
                        <span>(0917) 123 4567</span>
                    </div>

                    <div class="contact-item">
                        <span class="contact-label">Profiles</span>
                        <div class="social-links">
                            <a href="(insert sentence)" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                            <a href="(insert sentence)" target="_blank" rel="noopener noreferrer">Behance</a>
                        </div>
                    </div>
                </div>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="senderName">Your Name</label>
                        <input type="text" id="senderName" name="senderName" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="senderEmail">Your Email</label>
                        <input type="email" id="senderEmail" name="senderEmail" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="senderMessage">Message</label>
                        <textarea id="senderMessage" name="senderMessage" rows="4" placeholder="Write your message..." required></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                    <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>(insert sentence)</p>
    </footer>

    <div class="music-bar" aria-label="Music player">
        <div class="track-info">
            <span id="trackTitle">I will stand (BG musicvideo)</span>
        </div>

        <div class="player-controls">
            <button type="button" id="prevBtn" aria-label="Previous track">Prev</button>
            <button type="button" id="playPauseBtn" aria-label="Play or pause">Play</button>
            <button type="button" id="nextBtn" aria-label="Next track">Next</button>
        </div>

        <div class="progress-wrap">
            <input type="range" id="seekBar" value="0" min="0" max="100" step="1" aria-label="Seek">
        </div>

        <audio id="audioPlayer" preload="metadata"></audio>
    </div>

    <script src="script2.js"></script>
</body>
</html>
